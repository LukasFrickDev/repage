name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect CI components
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.components.outputs.frontend_changed }}
      backend_changed: ${{ steps.components.outputs.backend_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Detect components
        id: components
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_COMPARE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            selection="$(bash .github/scripts/detect-ci-components.sh --full)"
          else
            selection="$(bash .github/scripts/detect-ci-components.sh "$CI_BASE_SHA" "$CI_COMPARE_SHA")"
          fi
          read -r frontend_changed backend_changed <<< "$selection"
          printf 'frontend_changed=%s\n' "$frontend_changed" >> "$GITHUB_OUTPUT"
          printf 'backend_changed=%s\n' "$backend_changed" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    needs: detect
    if: needs.detect.outputs.frontend_changed == '1'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SITE_INDEXING_ENABLED: 'false'
      VITE_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build SAFE
        run: npm run build

      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install --with-deps --only-shell chromium

      - name: End-to-end tests
        run: npm run test:e2e

  backend:
    name: Backend
    needs: detect
    if: needs.detect.outputs.backend_changed == '1'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: repage_ci
          POSTGRES_USER: repage_ci
          POSTGRES_PASSWORD: repage_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U repage_ci -d repage_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_ENVIRONMENT: development
      DJANGO_DEBUG: 'True'
      POSTGRES_DB: repage_ci
      POSTGRES_USER: repage_ci
      POSTGRES_PASSWORD: repage_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate operational shell scripts
        working-directory: ${{ github.workspace }}
        run: bash -n .github/scripts/deploy-production.sh .github/scripts/detect-deploy-components.sh .github/scripts/detect-ci-components.sh .github/scripts/resolve-deploy-plan.sh .github/scripts/finalize-deploy.sh

      - name: Django checks
        run: python manage.py check

      - name: Migration checks
        run: python manage.py makemigrations --check --dry-run

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest

  ci-gate:
    name: CI Gate
    needs: [detect, frontend, backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validate selected checks
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_CHANGED: ${{ needs.detect.outputs.frontend_changed }}
          BACKEND_CHANGED: ${{ needs.detect.outputs.backend_changed }}
        run: |
          set -Eeuo pipefail
          test "$DETECT_RESULT" = success
          if [ "$FRONTEND_CHANGED" = '1' ]; then
            test "$FRONTEND_RESULT" = success
          else
            test "$FRONTEND_RESULT" = skipped
          fi
          if [ "$BACKEND_CHANGED" = '1' ]; then
            test "$BACKEND_RESULT" = success
          else
            test "$BACKEND_RESULT" = skipped
          fi
