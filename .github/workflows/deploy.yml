name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
      DEPLOY_FRONTEND_PATH: ${{ vars.DEPLOY_FRONTEND_PATH }}
      DEPLOY_BACKEND_PATH: ${{ vars.DEPLOY_BACKEND_PATH }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_SITE_INDEXING_ENABLED: ${{ vars.VITE_SITE_INDEXING_ENABLED }}
      VITE_PRIVACY_POLICY_VERSION: ${{ vars.VITE_PRIVACY_POLICY_VERSION }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Checkout deploy SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Validate production build inputs
        run: |
          set -Eeuo pipefail
          test "$VITE_SITE_INDEXING_ENABLED" = "false"
          test -n "$VITE_API_BASE_URL"
          test -n "$VITE_PRIVACY_POLICY_VERSION"
          test -n "$DEPLOY_SHA"

      - name: Verify deploy SHA is current main
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [ "$DEPLOY_SHA" != "$current_main_sha" ]; then
            echo "Deploy aborted: approved SHA is not the current origin/main HEAD."
            exit 1
          fi

      - name: Plan production deploy
        id: deploy_plan
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          bash .github/scripts/deploy-production.sh plan > "$RUNNER_TEMP/deploy-plan.out"
          cat "$RUNNER_TEMP/deploy-plan.out" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.deploy_plan.outputs.deploy_frontend == '1'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend SAFE
        if: steps.deploy_plan.outputs.deploy_frontend == '1'
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          npm ci
          npm run build
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/portfolio/index.html
          test -f dist/portfolio/axium/index.html
          test -f dist/privacidade/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/.htaccess

      - name: Package deploy artifacts
        if: steps.deploy_plan.outputs.deploy_frontend == '1' || steps.deploy_plan.outputs.deploy_backend == '1'
        run: |
          set -Eeuo pipefail
          if [ "${{ steps.deploy_plan.outputs.deploy_frontend }}" = '1' ]; then
            (cd frontend/dist && find . -type f -print | sed 's#^./##' | sort) > "$RUNNER_TEMP/frontend.manifest"
            tar -czf "$RUNNER_TEMP/frontend.tar.gz" -C frontend/dist .
          fi
          if [ "${{ steps.deploy_plan.outputs.deploy_backend }}" = '1' ]; then
            tar -czf "$RUNNER_TEMP/backend.tar.gz" \
              --exclude='./.env' \
              --exclude='./.env.*' \
              --exclude='./.venv' \
              --exclude='./.pytest_cache' \
              --exclude='./.ruff_cache' \
              --exclude='./requirements-dev.txt' \
              --exclude='./__pycache__' \
              --exclude='*/__pycache__' \
              --exclude='./tmp' \
              --exclude='./tests' \
              --exclude='./docker-compose.yml' \
              --exclude='./env.txt' \
              --exclude='*.log' \
              -C backend .
            tar -tzf "$RUNNER_TEMP/backend.tar.gz" \
              | sed 's#^\./##' \
              | awk 'NF && $0 !~ /\/$/' \
              | sort > "$RUNNER_TEMP/backend.manifest"
          fi

      - name: Deploy over pinned SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          FRONTEND_ARCHIVE: ${{ runner.temp }}/frontend.tar.gz
          BACKEND_ARCHIVE: ${{ runner.temp }}/backend.tar.gz
          FRONTEND_MANIFEST: ${{ runner.temp }}/frontend.manifest
          BACKEND_MANIFEST: ${{ runner.temp }}/backend.manifest
          DEPLOY_PLAN_FRONTEND: ${{ steps.deploy_plan.outputs.deploy_frontend }}
          DEPLOY_PLAN_BACKEND: ${{ steps.deploy_plan.outputs.deploy_backend }}
          DEPLOY_PLAN_FINALIZE_ONLY: ${{ steps.deploy_plan.outputs.finalize_only }}
          DEPLOY_PLAN_RECOVERY_FULL: ${{ steps.deploy_plan.outputs.recovery_full }}
        if: steps.deploy_plan.outputs.deploy_frontend == '1' || steps.deploy_plan.outputs.deploy_backend == '1'
        run: bash .github/scripts/deploy-production.sh

      - name: Smoke production endpoints
        if: steps.deploy_plan.outputs.deploy_frontend == '1' || steps.deploy_plan.outputs.deploy_backend == '1' || steps.deploy_plan.outputs.finalize_only == '1'
        run: |
          set -Eeuo pipefail
          smoke_tmp="$(mktemp -d)"
          trap 'rm -rf "$smoke_tmp"' EXIT
          curl --fail --silent --show-error --location --max-time 15 --retry 3 --retry-delay 2 https://api.repage.com.br/health/ >/dev/null
          curl --fail --silent --show-error --location --max-time 15 --retry 3 --retry-delay 2 https://api.repage.com.br/health/ready/ >/dev/null
          curl --fail --silent --show-error --location --max-time 15 --retry 3 --retry-delay 2 https://repage.com.br/ --output "$smoke_tmp/homepage.html"
          curl --fail --silent --show-error --location --max-time 15 --retry 3 --retry-delay 2 https://repage.com.br/portfolio/ >/dev/null
          curl --fail --silent --show-error --location --max-time 15 --retry 3 --retry-delay 2 https://repage.com.br/portfolio/axium/ >/dev/null
          curl --fail --silent --show-error --location --max-time 15 --retry 3 --retry-delay 2 https://repage.com.br/privacidade/ >/dev/null
          curl --fail --silent --show-error --location --max-time 15 --retry 3 --retry-delay 2 https://repage.com.br/cookies/ >/dev/null
          curl --fail --silent --show-error --location --max-time 15 --retry 3 --retry-delay 2 https://repage.com.br/sitemap.xml >/dev/null
          curl --fail --silent --show-error --location --max-time 15 --retry 3 --retry-delay 2 https://repage.com.br/robots.txt --output "$smoke_tmp/robots.txt"
          curl --fail --silent --show-error --location --max-time 15 --retry 3 --retry-delay 2 https://api.repage.com.br/admin/ >/dev/null
          grep -Eq '^[[:space:]]*Disallow:[[:space:]]*/[[:space:]]*$' "$smoke_tmp/robots.txt"
          python - "$smoke_tmp/homepage.html" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          class RobotsMetaParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.valid = False

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "meta":
                      return
                  attributes = {key.lower(): value or "" for key, value in attrs}
                  name = " ".join(attributes.get("name", "").split()).lower()
                  content = " ".join(attributes.get("content", "").split()).lower()
                  if name == "robots" and content == "noindex, nofollow":
                      self.valid = True

          parser = RobotsMetaParser()
          parser.feed(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not parser.valid:
              raise SystemExit("Homepage robots meta policy check failed.")
          PY
          status_code="$(curl --silent --show-error --location --max-time 15 --retry 3 --retry-delay 2 --output /dev/null --write-out '%{http_code}' https://repage.com.br/route-that-does-not-exist-for-smoke)"
          test "$status_code" = "404"

      - name: Finalize production deploy after smoke
        if: steps.deploy_plan.outputs.deploy_frontend == '1' || steps.deploy_plan.outputs.deploy_backend == '1' || steps.deploy_plan.outputs.finalize_only == '1'
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_PLAN_FRONTEND: ${{ steps.deploy_plan.outputs.deploy_frontend }}
          DEPLOY_PLAN_BACKEND: ${{ steps.deploy_plan.outputs.deploy_backend }}
        run: bash .github/scripts/deploy-production.sh finalize
