name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
      DEPLOY_FRONTEND_PATH: ${{ vars.DEPLOY_FRONTEND_PATH }}
      DEPLOY_BACKEND_PATH: ${{ vars.DEPLOY_BACKEND_PATH }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_SITE_INDEXING_ENABLED: ${{ vars.VITE_SITE_INDEXING_ENABLED }}
      VITE_PRIVACY_POLICY_VERSION: ${{ vars.VITE_PRIVACY_POLICY_VERSION }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout deploy SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate production build inputs
        run: |
          set -Eeuo pipefail
          test "$VITE_SITE_INDEXING_ENABLED" = "false"
          test -n "$VITE_API_BASE_URL"
          test -n "$VITE_PRIVACY_POLICY_VERSION"
          test -n "$DEPLOY_SHA"

      - name: Verify deploy SHA is current main
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [ "$DEPLOY_SHA" != "$current_main_sha" ]; then
            echo "Deploy aborted: approved SHA is not the current origin/main HEAD."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend SAFE
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          npm ci
          npm run build
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/portfolio/index.html
          test -f dist/portfolio/axium/index.html
          test -f dist/privacidade/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/.htaccess

      - name: Package deploy artifacts
        run: |
          set -Eeuo pipefail
          (cd frontend/dist && find . -type f -print | sed 's#^./##' | sort) > "$RUNNER_TEMP/frontend.manifest"
          tar -czf "$RUNNER_TEMP/frontend.tar.gz" -C frontend/dist .
          tar -czf "$RUNNER_TEMP/backend.tar.gz" \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./.venv' \
            --exclude='./.pytest_cache' \
            --exclude='./.ruff_cache' \
            --exclude='./__pycache__' \
            --exclude='*/__pycache__' \
            --exclude='./tmp' \
            --exclude='./tests' \
            --exclude='./docker-compose.yml' \
            --exclude='./env.txt' \
            --exclude='*.log' \
            -C backend .
          tar -tzf "$RUNNER_TEMP/backend.tar.gz" \
            | sed 's#^\./##' \
            | awk 'NF && $0 !~ /\/$/' \
            | sort > "$RUNNER_TEMP/backend.manifest"

      - name: Deploy over pinned SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          FRONTEND_ARCHIVE: ${{ runner.temp }}/frontend.tar.gz
          BACKEND_ARCHIVE: ${{ runner.temp }}/backend.tar.gz
          FRONTEND_MANIFEST: ${{ runner.temp }}/frontend.manifest
          BACKEND_MANIFEST: ${{ runner.temp }}/backend.manifest
        run: bash .github/scripts/deploy-production.sh

      - name: Smoke production endpoints
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --max-time 15 --retry 3 --retry-delay 2 https://api.repage.com.br/health/ >/dev/null
          curl --fail --silent --show-error --location --max-time 15 --retry 3 --retry-delay 2 https://api.repage.com.br/health/ready/ >/dev/null
          curl --fail --silent --show-error --location --max-time 15 --retry 3 --retry-delay 2 https://repage.com.br/ >/dev/null
          curl --fail --silent --show-error --location --max-time 15 --retry 3 --retry-delay 2 https://repage.com.br/portfolio/axium/ >/dev/null
          status_code="$(curl --silent --show-error --location --max-time 15 --retry 3 --retry-delay 2 --output /dev/null --write-out '%{http_code}' https://repage.com.br/route-that-does-not-exist-for-smoke)"
          test "$status_code" = "404"
